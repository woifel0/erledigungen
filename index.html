<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Erledigungen">
  <title>Erledigungen</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="js/settings.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-red"></span>
    <span class="blob blob-orange"></span>
    <span class="blob blob-green"></span>
    <span class="blob blob-blue"></span>
  </div>

  <div class="app" id="app" data-view="overview">

    <!-- Ordner -->
    <aside class="pane sidebar glass" id="sidebar" aria-label="Ordner">
      <div class="pane-inner sidebar-inner">
        <header class="sidebar-head">
          <div class="brand"><span class="brand-mark"></span><span>Erledigungen</span></div>
          <div class="head-actions">
          <button class="icon-btn" type="button" data-action="settings" title="Einstellungen" aria-label="Einstellungen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          </button>
          <button class="icon-btn only-desktop" type="button" data-toggle="sidebar" title="Ordner einklappen" aria-label="Ordner einklappen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
          </button>
          </div>
        </header>

        <button class="nav-item" id="navOverview" type="button" data-action="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2.2"/></svg>
          <span>Übersicht</span>
        </button>

        <div class="section-label">Ordner</div>
        <nav class="folder-nav" id="folderNav"></nav>

        <button class="new-btn sidebar-new" type="button" data-action="new-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Neue Notiz</span>
        </button>
      </div>
    </aside>
    <div class="resizer" data-resize="sidebar" role="separator" aria-orientation="vertical" title="Ziehen zum Anpassen · Doppelklick zum Zurücksetzen"></div>

    <!-- Notizliste -->
    <section class="pane list glass" id="listPane" aria-label="Notizen">
      <div class="pane-inner list-inner">
        <header class="pane-head">
          <div class="pane-title"><span class="dot"></span><h2 id="listTitle"></h2></div>
          <div class="head-actions">
            <button class="icon-btn" type="button" data-action="new-note" title="Neue Notiz" aria-label="Neue Notiz">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon-btn only-desktop" type="button" data-toggle="list" title="Liste einklappen" aria-label="Liste einklappen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
            </button>
          </div>
        </header>
        <div class="pane-sub" id="listCount"></div>
        <div class="note-list scroll" id="noteList"></div>
      </div>
    </section>
    <div class="resizer" data-resize="list" role="separator" aria-orientation="vertical" title="Ziehen zum Anpassen · Doppelklick zum Zurücksetzen"></div>

    <!-- Editor -->
    <main class="pane editor glass is-empty" id="editorPane">
      <header class="editor-bar">
        <button class="icon-btn only-mobile" type="button" data-action="close-editor" title="Zurück" aria-label="Zurück">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="bar-group only-desktop">
          <button class="icon-btn toggle-btn" type="button" data-toggle="sidebar" title="Ordner ein-/ausblenden" aria-label="Ordner ein- oder ausblenden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16"/></svg>
          </button>
          <button class="icon-btn toggle-btn" type="button" data-toggle="list" title="Liste ein-/ausblenden" aria-label="Liste ein- oder ausblenden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>
          </button>
        </div>
        <div class="seg" id="seg" role="radiogroup" aria-label="Ordner der Notiz"></div>
        <div class="bar-spacer"></div>
        <span class="save-state" id="saveState" data-state="saved">Gespeichert</span>
        <button class="del-btn" id="deleteBtn" type="button" title="Notiz löschen" aria-label="Notiz löschen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
          <span class="label">Löschen?</span>
        </button>
      </header>

      <div class="editor-body" id="editorBody">
        <input class="title-input" id="titleInput" type="text" placeholder="Titel" autocomplete="off" aria-label="Titel">
        <div class="editor-meta" id="editorMeta"></div>
        <textarea class="body-input" id="bodyInput" placeholder="Schreib los …" aria-label="Notiz"></textarea>
      </div>

      <div class="editor-empty">
        <div class="empty-orb"></div>
        <p>Wähle eine Notiz aus oder leg eine neue an.</p>
        <button class="ghost-btn" type="button" data-action="new-note">Neue Notiz</button>
      </div>
    </main>

    <!-- Übersicht -->
    <section class="pane overview glass" id="overviewPane" aria-label="Übersicht">
      <header class="overview-head">
        <button class="icon-btn toggle-btn only-desktop" type="button" data-toggle="sidebar" title="Ordner ein-/ausblenden" aria-label="Ordner ein- oder ausblenden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16"/></svg>
        </button>
        <div class="titles">
          <h1>Übersicht</h1>
          <p id="overviewSub"></p>
        </div>
        <button class="icon-btn" type="button" data-action="settings" title="Einstellungen" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        </button>
        <button class="new-btn" type="button" data-action="new-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Neue Notiz</span>
        </button>
      </header>
      <div class="overview-scroll scroll">
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </div>

  <div class="modal" id="settingsModal" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/vendor/supabase-2.117.2.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/settings-panel.js"></script>
  <script>
    // Offline-Start am Handy (nur über https bzw. localhost möglich)
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
